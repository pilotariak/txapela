# prek-only: `repo: builtin`, `priority` and `minimum_prek_version` are not supported by pre-commit.
minimum_prek_version: "0.5.6"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
# Priority: each hook that modifies files runs alone (0-5), then the read-only checks run in parallel (10).
repos:
# Core
- repo: builtin
  hooks:
  - id: trailing-whitespace
    name: "📁 filesystem /📝 files - check whitespace"
    priority: 0
  - id: end-of-file-fixer
    name: "📁 filesystem /📝 files - check end of file"
    priority: 1
  - id: mixed-line-ending
    name: "📁 filesystem /📝 files - check line endings"
    priority: 2
  - id: check-added-large-files
    name: "📁 filesystem /📝 files - check large files"
    priority: 10
  - id: check-case-conflict
    name: "📁 filesystem /📝 files - check case conflicts"
    priority: 10
  - id: check-merge-conflict
    name: "📁 filesystem /📝 files - check merge conflicts"
    priority: 10
  - id: check-executables-have-shebangs
    name: "📁 filesystem /⚙️ exec · Verify shebang presence"
    priority: 10
  - id: check-shebang-scripts-are-executable
    name: "📁 filesystem /⚙️ exec · Verify script permissions"
    priority: 10
  - id: check-yaml
    name: "✅ yaml / Validate YAML syntax"
    priority: 10
  - id: check-toml
    name: "✅ toml / Validate TOML syntax"
    priority: 10
  - id: check-json
    name: "✅ json / Validate JSON syntax"
    priority: 10
  - id: detect-private-key
    name: "🔒 security / Detect private keys"
    priority: 10
  - id: check-commit-trailers
    name: "✅ git / DCO sign-off"
    args: [--require, Signed-off-by]
    stages: [commit-msg]
    priority: 10
- repo: local
  hooks:
  - id: hawkeye
    name: "✅ Hawkeye / License header"
    entry: hawkeye format
    language: system
    pass_filenames: false
    priority: 5
  - id: taplo
    name: "📝 Taplo / TOML formatting"
    entry: taplo fmt
    language: system
    types: [toml]
    priority: 3
- repo: https://github.com/google/yamlfmt
  rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # frozen: v0.21.0
  hooks:
  - id: yamlfmt
    name: "📝 yamlfmt / YAML formatting"
    priority: 4
- repo: https://github.com/rvben/rumdl-pre-commit
  rev: b0cff962ee693b9e612c097d22e71e0cba127447 # frozen: v0.3.2
  hooks:
  - id: rumdl
    name: "📝 rumdl / Markdown linting"
    priority: 10
# Lint
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
  hooks:
  - id: conventional-pre-commit
    name: "✅ git / Conventional commits"
    stages: [commit-msg]
    args: [] # optional: list of Conventional Commits types to allow e.g. [feat, fix, ci, chore, test]
    priority: 10
# CI/CD
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df # frozen: 0.39.0
  hooks:
  - id: check-renovate
    name: "✅ renovate / Validate Renovate configuration"
    additional_dependencies: ["json5"]
    priority: 10
  - id: check-github-actions
    name: "✅ github-actions / Validate Github Actions configuration"
    priority: 10
  - id: check-github-workflows
    name: "✅ github-actions / Validate Github Actions workflow"
    priority: 10
# Security
- repo: https://github.com/gitleaks/gitleaks
  rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
  hooks:
  - id: gitleaks
    name: "🔒 security / Detect hardcoded secrets"
    priority: 10
# Rust
- repo: https://github.com/doublify/pre-commit-rust
  rev: eeee35a89e69d5772bdee97db1a6a898467b686e # frozen: v1.0
  hooks:
  - id: fmt
    args: ["--all", "--", "--check"]
    priority: 6
  - id: cargo-check
    args: ["--all-features", "--all-targets"]
    priority: 10
- repo: local
  hooks:
  - id: clippy
    name: "🦀 Rust / Clippy"
    description: "Rust linter"
    entry: cargo clippy -- -D warnings
    language: system
    types: [rust]
    pass_filenames: false
    priority: 10
  - id: cargo-audit
    name: "🔒 Rust / Security audit"
    description: "Security vulnerability scanner"
    entry: cargo audit
    language: system
    pass_filenames: false
    priority: 10
