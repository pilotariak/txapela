name = "txapela"
main = "build/index.js"
compatibility_date = "2026-11-13"

[build]
command = "cargo install -q --locked worker-build@0.9.0 && worker-build --release"

[dev]
port = 8793
inspector_port = 9244

[vars]
ALLOWED_ORIGINS = "https://kancha.pilotariak.com"

[[routes]]
pattern = "txapela.pilotariak.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "pilotariak-txapela"
database_id = "eac51396-213d-4920-9471-adc38c504fdd"
migrations_dir = "database/migrations"

[observability.logs]
enabled = true
invocation_logs = true
