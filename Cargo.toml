[package]
name = "txapela"
version = "0.1.0"
authors = ["Nicolas Lamirault <nicolas.lamirault@gmail.com>"]
autobenches = false
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "A Pilotariak service/application"
repository = "https://github.com/pilotariak/txapela"
publish = false

[[bin]]
name = "txapela"
path = "src/main.rs"
bench = false

[dependencies]
# Add your runtime dependencies here

[dev-dependencies]
# Add your development and testing dependencies here

[profile.release]
opt-level = 3     # Maximum optimization
lto = true        # Link-time optimization
codegen-units = 1 # Better optimization, slower build
strip = true      # Strip debug symbols
