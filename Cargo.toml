[package]
name = "txapela"
version = "0.1.0"
authors = ["Nicolas Lamirault <nicolas.lamirault@gmail.com>"]
edition = "2024"
description = "Pelota tournaments run by a club: a Cloudflare Worker in Rust with a D1 database"
license = "Apache-2.0"
repository = "https://github.com/pilotariak/txapela"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Civil dates (YYYY-MM-DD, Europe/Paris) of a tournament. A Worker has no system tz database:
# `jiff::tz::get!` (feature `static`) embeds Europe/Paris from jiff-tzdb at compile time, so a
# tzdata update needs a rebuild. The default features look for a system tz database and stay off.
# Never call `Timestamp::now()`: without the `js` feature it panics on wasm32-unknown-unknown.
# Take the time from the Worker and pass it in.
jiff = { version = "1.0.2", default-features = false, features = ["std", "static"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The organizer token is compared by its SHA-256 (src/api/auth.rs).
sha2 = { version = "0.11.1", default-features = false }
worker = { version = "0.9.0", features = ["d1"] }

[dev-dependencies]
# The OpenAPI document (openapi.json) is generated by a unit test from the #[utoipa::path]
# annotations, which only exist under cfg(test). The Worker serves the committed file, embedded
# with include_str! (src/api/contract.rs), never one generated at runtime, so the wasm build
# carries no schema code. See src/api/openapi.rs.
utoipa = "6.0.0"

# `make check` runs clippy with -D warnings, so these warnings fail the build.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
